<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recibos">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mis recibos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: una sola columna tipo app de celular. Encabezado fijo, lista agrupada por mes, botón flotante para agregar, hojas desde abajo para editar. */
:root{
  --font-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bg:#f3f6f5;--surface:#ffffff;--fg:#13201d;--muted:#5b6d67;--line:#dce5e1;
  --accent:#0f766e;--on-accent:#ffffff;
  --danger:#b42318;--on-danger:#ffffff;
  --warn-bg:#fdf3d6;--warn-fg:#6b4a00;--warn-line:#ecd48a;
  --t-sueldo:#0f766e;--t-aguinaldo:#a3620a;--t-licencia:#245fa8;--t-otro:#6a45b8;--on-badge:#ffffff;
  --scrim:rgba(8,16,14,.55);--shadow:0 1px 2px rgba(10,30,25,.08);
  --viewer-bg:#050807;--viewer-fg:#f2f6f4;--viewer-btn:rgba(255,255,255,.14);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1513;--surface:#16211e;--fg:#e6eeeb;--muted:#8fa19b;--line:#25332f;
    --accent:#2dd4bf;--on-accent:#08211d;
    --danger:#f0776b;--on-danger:#1a0705;
    --warn-bg:#2b2410;--warn-fg:#f1d27a;--warn-line:#493d17;
    --t-sueldo:#2dd4bf;--t-aguinaldo:#f2b04e;--t-licencia:#6fb2f0;--t-otro:#b79bf2;--on-badge:#0a1411;
    --scrim:rgba(0,0,0,.65);--shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1513;--surface:#16211e;--fg:#e6eeeb;--muted:#8fa19b;--line:#25332f;
  --accent:#2dd4bf;--on-accent:#08211d;
  --danger:#f0776b;--on-danger:#1a0705;
  --warn-bg:#2b2410;--warn-fg:#f1d27a;--warn-line:#493d17;
  --t-sueldo:#2dd4bf;--t-aguinaldo:#f2b04e;--t-licencia:#6fb2f0;--t-otro:#b79bf2;--on-badge:#0a1411;
  --scrim:rgba(0,0,0,.65);--shadow:none;
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{
  margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--font-body);
  padding-block:0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100vh;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);
  display:flex;align-items:center;gap:10px;padding-block:12px 10px;border-bottom:1px solid var(--line);
}
header h1{font:700 22px/1.1 var(--font-display);margin:0;flex:1;min-width:0;letter-spacing:-.01em}
select,input[type=month],textarea{
  font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;max-width:100%;
}
.iconbtn{background:var(--surface);border:1px solid var(--line);color:var(--fg);border-radius:10px;width:42px;height:42px;font-size:20px;line-height:1;cursor:pointer}

main{padding-block:6px 110px}
.month{margin:20px 0 8px;font:700 13px/1 var(--font-display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.card{
  display:flex;gap:12px;align-items:center;width:100%;text-align:left;cursor:pointer;
  background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;box-shadow:var(--shadow);font:inherit;
}
.thumb{width:62px;height:62px;border-radius:9px;object-fit:cover;background:var(--line);flex:none}
.info{flex:1;min-width:0}
.badge{display:inline-block;font-size:12px;font-weight:700;color:var(--on-badge);border-radius:99px;padding:2px 10px}
.t-Sueldo{background:var(--t-sueldo)}.t-Aguinaldo{background:var(--t-aguinaldo)}.t-Licencia{background:var(--t-licencia)}.t-Otro{background:var(--t-otro)}
.sub{color:var(--muted);font-size:13px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex{color:var(--warn-fg);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:56px 8px 20px}
.empty b{display:block;font:700 19px/1.2 var(--font-display);color:var(--fg);margin-bottom:8px}
.empty .btn{display:inline-block;flex:none;margin-top:18px;padding:11px 18px}

#fab{
  position:fixed;z-index:12;
  right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  background:var(--accent);color:var(--on-accent);border:0;border-radius:99px;padding:15px 22px;font-size:16px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.28);
}

.overlay{position:fixed;inset:0;background:var(--scrim);z-index:20;display:none;align-items:flex-end}
.overlay.on{display:flex}
.sheet{
  background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;
  padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
.sheet h2{margin:0 0 6px;font:700 20px/1.2 var(--font-display)}
label.l{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:8px 16px;font-weight:600;font-size:15px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.row{display:flex;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.btn{flex:1;border:0;border-radius:12px;padding:13px;font-weight:700;font-size:16px;background:var(--accent);color:var(--on-accent);text-align:center;cursor:pointer}
.btn.sec{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:var(--on-danger)}
.btn:disabled{opacity:.45;cursor:default}
.previews{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.pv{position:relative}
.pv img{width:86px;height:86px;object-fit:cover;border-radius:10px;display:block;background:var(--line)}
.pv button{position:absolute;top:-7px;right:-7px;width:26px;height:26px;border-radius:50%;border:0;background:var(--danger);color:var(--on-danger);font-size:13px;line-height:1;cursor:pointer}
textarea{width:100%;resize:vertical;min-height:64px}
input[type=file]{display:none}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.note.warn{background:var(--warn-bg);color:var(--warn-fg);border:1px solid var(--warn-line);border-radius:10px;padding:9px 11px}
.sect{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.sect h3{margin:0 0 8px;font:700 14px/1.2 var(--font-display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}

#viewer{background:var(--viewer-bg);z-index:30;flex-direction:column;align-items:stretch}
#viewer .top{
  display:flex;gap:8px;align-items:center;color:var(--viewer-fg);
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
}
#viewer .ttl{flex:1;min-width:0}
#viewer .ttl b{display:block;font:700 16px/1.2 var(--font-display)}
#viewer .ttl span{font-size:13px;opacity:.75;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbtn{background:var(--viewer-btn);color:var(--viewer-fg);border:0;border-radius:10px;padding:9px 13px;font-weight:600;font-size:15px;cursor:pointer}
.pages{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.pages img{flex:none;width:100%;height:100%;object-fit:contain;scroll-snap-align:center}
.dots{color:var(--viewer-fg);text-align:center;padding:8px 16px calc(10px + env(safe-area-inset-bottom,0px));font-size:13px;opacity:.8;min-height:20px}

#confirmOv{z-index:40;align-items:center;justify-content:center;padding:20px}
.dialog{background:var(--bg);border-radius:16px;padding:18px;width:100%;max-width:380px}
.dialog p{margin:0 0 16px}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);z-index:50;max-width:calc(100% - 32px);
  bottom:calc(88px + env(safe-area-inset-bottom,0px));
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:500;
}
.banner{background:var(--warn-bg);color:var(--warn-fg);border:1px solid var(--warn-line);border-radius:12px;padding:10px 12px;font-size:14px;margin:12px 0 4px}
#printArea{display:none}
@media print{
  @page{margin:10mm}
  body>*:not(#printArea){display:none!important}
  body{background:#fff;padding:0;min-height:0}
  body::before{display:none}
  #printArea{display:block}
  #printArea img{display:block;width:100%;max-height:270mm;object-fit:contain;break-after:page;page-break-after:always}
  #printArea img:last-child{break-after:auto;page-break-after:auto}
}
@media (prefers-reduced-motion:no-preference){.card:active,.chip:active,.btn:active{transform:scale(.98)}}
</style>
</head>
<body>
<header>
  <h1>Mis recibos</h1>
  <select id="yearSel" aria-label="Año" hidden></select>
  <button class="iconbtn" id="menuBtn" aria-label="Menú">⋯</button>
</header>
<main id="list"></main>
<button id="fab">＋ Agregar recibo</button>

<!-- Agregar / editar -->
<div class="overlay" id="sheetOv">
  <div class="sheet">
    <h2 id="sheetTitle">Nuevo recibo</h2>
    <label class="l">Tipo</label>
    <div class="chips" id="typeChips"></div>
    <label class="l" for="ym">Mes que corresponde</label>
    <input type="month" id="ym">
    <label class="l">Fotos</label>
    <div class="row">
      <button class="btn sec" id="camBtn" type="button">📷 Sacar foto</button>
      <button class="btn sec" id="galBtn" type="button">🖼️ Galería</button>
    </div>
    <input type="file" id="camIn" accept="image/*" capture="environment">
    <input type="file" id="galIn" accept="image/*" multiple>
    <div class="previews" id="previews"></div>
    <label class="l" for="note">Nota (opcional)</label>
    <textarea id="note" placeholder="Ej: incluye horas extra"></textarea>
    <div class="row" style="margin-top:20px">
      <button class="btn sec" id="cancelBtn" type="button">Cancelar</button>
      <button class="btn" id="saveBtn" type="button">Guardar</button>
    </div>
  </div>
</div>

<!-- Visor -->
<div class="overlay" id="viewer">
  <div class="top">
    <div class="ttl"><b id="vTitle"></b><span id="vSub"></span></div>
    <button class="vbtn" id="vEdit" type="button">Editar</button>
    <button class="vbtn" id="vDel" type="button">Borrar</button>
    <button class="vbtn" id="vPrint" type="button" aria-label="Imprimir">🖨️</button>
    <button class="vbtn" id="vClose" type="button" aria-label="Cerrar">✕</button>
  </div>
  <div class="pages" id="vPages"></div>
  <div class="dots" id="vDots"></div>
</div>

<!-- Menú -->
<div class="overlay" id="menuOv">
  <div class="sheet">
    <h2>Opciones</h2>
    <p class="note" id="menuInfo" style="margin-top:0"></p>
    <div class="sect">
      <h3>Backup</h3>
      <div class="col">
        <button class="btn" id="expBtn" type="button">⬇️ Exportar backup (ZIP)</button>
        <button class="btn sec" id="impBtn" type="button">⬆️ Importar backup</button>
      </div>
      <input type="file" id="impIn" accept=".zip,application/zip">
      <p class="note">Si borrás los datos del navegador o cambiás de teléfono, perdés los recibos. Exportá un backup de vez en cuando y guardalo en la nube o mandalo por mail.</p>
    </div>
    <div class="row" style="margin-top:20px"><button class="btn sec" id="menuClose" type="button">Cerrar</button></div>
  </div>
</div>

<!-- Confirmación -->
<div class="overlay" id="confirmOv">
  <div class="dialog">
    <p id="confirmMsg"></p>
    <div class="row">
      <button class="btn sec" id="confirmNo" type="button">Cancelar</button>
      <button class="btn danger" id="confirmYes" type="button">Borrar</button>
    </div>
  </div>
</div>
<div id="printArea" aria-hidden="true"></div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const TIPOS=['Sueldo','Aguinaldo','Licencia','Otro'];
const $=id=>document.getElementById(id);
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- IndexedDB ---------- */
const DB_NAME='recibos-db',STORE='recibos';
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
const dbAll=()=>new Promise((res,rej)=>{const q=db.transaction(STORE).objectStore(STORE).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});
const dbPut=v=>new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(v);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});
const dbDel=id=>new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});

/* ---------- Imágenes ---------- */
async function loadBitmap(file){
  if('createImageBitmap' in window){
    try{return await createImageBitmap(file,{imageOrientation:'from-image'});}catch(e){}
  }
  return await new Promise((res,rej)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{URL.revokeObjectURL(u);res(img);};
    img.onerror=rej;img.src=u;
  });
}
async function toJpeg(file,max,q){
  const bmp=await loadBitmap(file);
  const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight;
  const s=Math.min(1,max/Math.max(w,h));
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));
  const ctx=c.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  ctx.drawImage(bmp,0,0,c.width,c.height);
  if(bmp.close)bmp.close();
  return await new Promise(r=>c.toBlob(r,'image/jpeg',q));
}

/* ---------- Estado ---------- */
let recibos=[],yearFilter='all',urls=[],draft=null,viewing=null;

function toast(msg){
  const t=$('toast');t.textContent=msg;t.hidden=false;
  clearTimeout(toast.h);toast.h=setTimeout(()=>{t.hidden=true;},2600);
}
function url(blob){const u=URL.createObjectURL(blob);urls.push(u);return u;}
function freeUrls(){urls.forEach(u=>URL.revokeObjectURL(u));urls=[];}

/* Confirmación dentro de la página (el visor bloquea confirm()) */
function askConfirm(msg,okLabel){
  return new Promise(res=>{
    $('confirmMsg').textContent=msg;$('confirmYes').textContent=okLabel||'Borrar';
    $('confirmOv').classList.add('on');
    const done=v=>{$('confirmOv').classList.remove('on');$('confirmYes').onclick=$('confirmNo').onclick=null;res(v);};
    $('confirmYes').onclick=()=>done(true);$('confirmNo').onclick=()=>done(false);
  });
}

/* ---------- Lista ---------- */
async function load(){recibos=await dbAll();render();}
function render(){
  freeUrls();
  const years=[...new Set(recibos.map(r=>r.year))].sort((a,b)=>b-a);
  const sel=$('yearSel');
  if(yearFilter!=='all'&&!years.includes(+yearFilter))yearFilter='all';
  sel.innerHTML='<option value="all">Todos</option>'+years.map(y=>`<option value="${y}">${y}</option>`).join('');
  sel.value=yearFilter;sel.hidden=years.length<1;

  const items=recibos.filter(r=>yearFilter==='all'||r.year===+yearFilter)
    .sort((a,b)=>(b.year-a.year)||(b.month-a.month)||(a.createdAt-b.createdAt));
  let html='';
  if(recibos.length){
    const last=+lsGet('lastExport')||0,days=(Date.now()-last)/864e5;
    if(!last||days>60)html+=`<div class="banner">${last?`Hace ${Math.floor(days)} días que no exportás un backup.`:'Todavía no exportaste ningún backup.'} Tocá ⋯ para hacerlo.</div>`;
  }
  if(!items.length){
    html+=`<div class="empty"><b>Todavía no hay recibos</b>Tocá “Agregar recibo” y sacale una foto al papel.</div>`;
    $('list').innerHTML=html;
    return;
  }
  let cur='';
  for(const r of items){
    const key=`${r.year}-${r.month}`;
    if(key!==cur){cur=key;html+=`<div class="month">${MESES[r.month-1]} ${r.year}</div>`;}
    const n=r.photos.length;
    html+=`<button class="card" type="button" data-id="${r.id}">
      <img class="thumb" alt="" src="${url(r.thumb||r.photos[0])}">
      <div class="info"><span class="badge t-${r.type}">${esc(r.type)}</span>
      <div class="sub">${n} foto${n>1?'s':''}${r.note?' · '+esc(r.note):''}</div></div></button>`;
  }
  $('list').innerHTML=html;
}
$('list').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)openViewer(c.dataset.id);});
$('yearSel').addEventListener('change',e=>{yearFilter=e.target.value;render();});

/* ---------- Visor ---------- */
function openViewer(id){
  const r=recibos.find(x=>x.id===id);if(!r)return;
  viewing=id;
  $('vTitle').textContent=`${r.type} · ${MESES[r.month-1]} ${r.year}`;
  $('vSub').textContent=(r.note||'');
  $('vPages').innerHTML=r.photos.map(p=>`<img alt="Foto del recibo" src="${url(p)}">`).join('');
  $('vPages').scrollLeft=0;updateDots();
  $('viewer').classList.add('on');
}
function updateDots(){
  const r=recibos.find(x=>x.id===viewing);if(!r)return;
  const p=$('vPages'),i=Math.round(p.scrollLeft/Math.max(1,p.clientWidth));
  $('vDots').textContent=r.photos.length>1?`Foto ${Math.min(i+1,r.photos.length)} de ${r.photos.length} · deslizá para ver la otra`:'';
}
$('vPages').addEventListener('scroll',updateDots);
$('vClose').onclick=()=>{$('viewer').classList.remove('on');viewing=null;};
$('vEdit').onclick=()=>{
  const r=recibos.find(x=>x.id===viewing);if(!r)return;
  $('viewer').classList.remove('on');openSheet(r);
};
/* Imprimir: cada foto va en su propia hoja. El título del documento da el nombre al guardar como PDF. */
async function printReceipt(){
  const r=recibos.find(x=>x.id===viewing);if(!r)return;
  const pa=$('printArea'),prevTitle=document.title;
  pa.innerHTML=r.photos.map(p=>`<img alt="" src="${url(p)}">`).join('');
  await Promise.all([...pa.querySelectorAll('img')].map(i=>i.decode?i.decode().catch(()=>{}):Promise.resolve()));
  document.title=`Recibo ${r.type} ${MESES[r.month-1]} ${r.year}`;
  const done=()=>{window.removeEventListener('afterprint',done);document.title=prevTitle;pa.innerHTML='';};
  window.addEventListener('afterprint',done);
  try{window.print();}catch(err){done();toast('Este navegador no permite imprimir');}
}
$('vPrint').onclick=printReceipt;
$('vDel').onclick=async()=>{
  const r=recibos.find(x=>x.id===viewing);if(!r)return;
  const ok=await askConfirm(`¿Borrar el recibo ${r.type} de ${MESES[r.month-1]} ${r.year}? No se puede deshacer.`,'Borrar');
  if(!ok)return;
  await dbDel(r.id);
  $('viewer').classList.remove('on');viewing=null;
  await load();toast('Recibo borrado');
};

/* ---------- Agregar / editar ---------- */
const nowYM=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;};
function openSheet(r){
  draft=r?{id:r.id,ym:`${r.year}-${pad(r.month)}`,type:r.type,note:r.note||'',photos:[...r.photos],createdAt:r.createdAt}
         :{id:null,ym:nowYM(),type:'Sueldo',note:'',photos:[]};
  $('sheetTitle').textContent=r?'Editar recibo':'Nuevo recibo';
  $('ym').value=draft.ym;$('note').value=draft.note;
  renderChips();renderPreviews();
  $('sheetOv').classList.add('on');
}
function closeSheet(){$('sheetOv').classList.remove('on');draft=null;}
function renderChips(){
  $('typeChips').innerHTML=TIPOS.map(t=>`<button type="button" class="chip${draft.type===t?' on':''}" data-t="${t}">${t}</button>`).join('');
}
$('typeChips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;draft.type=b.dataset.t;renderChips();});
let pvUrls=[];
function renderPreviews(){
  pvUrls.forEach(u=>URL.revokeObjectURL(u));pvUrls=[];
  $('previews').innerHTML=draft.photos.map((p,i)=>{
    const u=URL.createObjectURL(p);pvUrls.push(u);
    return `<div class="pv"><img alt="" src="${u}"><button type="button" data-i="${i}" aria-label="Quitar foto">✕</button></div>`;
  }).join('');
}
$('previews').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  draft.photos.splice(+b.dataset.i,1);renderPreviews();
});
$('camBtn').onclick=()=>$('camIn').click();
$('galBtn').onclick=()=>$('galIn').click();
async function addFiles(input){
  const files=[...input.files];input.value='';
  if(!files.length||!draft)return;
  $('saveBtn').disabled=true;toast('Procesando foto…');
  try{
    for(const f of files)draft.photos.push(await toJpeg(f,2200,0.88));
    renderPreviews();
  }catch(err){toast('No se pudo leer la imagen');}
  $('saveBtn').disabled=false;
}
$('camIn').onchange=e=>addFiles(e.target);
$('galIn').onchange=e=>addFiles(e.target);
$('cancelBtn').onclick=closeSheet;
$('saveBtn').onclick=async()=>{
  if(!draft.photos.length){toast('Agregá al menos una foto');return;}
  const [y,m]=($('ym').value||draft.ym).split('-').map(Number);
  if(!y||!m){toast('Elegí el mes');return;}
  $('saveBtn').disabled=true;
  try{
    const thumb=await toJpeg(draft.photos[0],260,0.8);
    const rec={
      id:draft.id||(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2)),
      year:y,month:m,type:draft.type,note:$('note').value.trim(),
      photos:draft.photos,thumb,createdAt:draft.createdAt||Date.now()
    };
    await dbPut(rec);
    closeSheet();await load();toast('Guardado');
  }catch(err){toast('No se pudo guardar: '+err.message);}
  $('saveBtn').disabled=false;
};
$('fab').onclick=()=>openSheet(null);

/* ---------- Menú y datos de prueba ---------- */
function openMenu(){
  const last=+lsGet('lastExport')||0,n=recibos.length;
  $('menuInfo').textContent=`${n} recibo${n===1?'':'s'} guardado${n===1?'':'s'} · Último backup: ${last?new Date(last).toLocaleDateString('es-UY'):'nunca'}`;
  $('menuOv').classList.add('on');
}
$('menuBtn').onclick=openMenu;
$('menuClose').onclick=()=>$('menuOv').classList.remove('on');
$('menuOv').addEventListener('click',e=>{if(e.target===$('menuOv'))$('menuOv').classList.remove('on');});

/* ---------- ZIP (sin compresión, sin librerías) ---------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(buf){let c=0xFFFFFFFF;for(let i=0;i<buf.length;i++)c=CRC[(c^buf[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0;}
function buildZip(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  const d=new Date();
  const time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  const date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const f of files){
    const name=enc.encode(f.name),crc=crc32(f.data),size=f.data.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint16(10,time,true);lh.setUint16(12,date,true);lh.setUint32(14,crc,true);
    lh.setUint32(18,size,true);lh.setUint32(22,size,true);lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,f.data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);
    ch.setUint16(12,time,true);ch.setUint16(14,date,true);ch.setUint32(16,crc,true);
    ch.setUint32(20,size,true);ch.setUint32(24,size,true);ch.setUint16(28,name.length,true);
    ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),name);
    off+=30+name.length+size;
  }
  const cdSize=central.reduce((a,p)=>a+p.length,0);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);
  end.setUint32(12,cdSize,true);end.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(end.buffer)],{type:'application/zip'});
}
async function readZip(file){
  const buf=new Uint8Array(await file.arrayBuffer()),dv=new DataView(buf.buffer);
  let e=-1;
  for(let i=buf.length-22;i>=Math.max(0,buf.length-65600);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break;}}
  if(e<0)throw new Error('No es un ZIP válido');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);
  const dec=new TextDecoder(),out={};
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50)throw new Error('ZIP dañado');
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true);
    const nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=dec.decode(buf.subarray(p+46,p+46+nl));
    if(method!==0)throw new Error('Este ZIP no fue creado por esta app');
    const lnl=dv.getUint16(lo+26,true),lel=dv.getUint16(lo+28,true),start=lo+30+lnl+lel;
    out[name]=buf.slice(start,start+csize);
    p+=46+nl+el+cl;
  }
  return out;
}

/* ---------- Backup ---------- */
$('expBtn').onclick=async()=>{
  if(!recibos.length){toast('No hay recibos para exportar');return;}
  $('expBtn').disabled=true;
  try{
    const files=[],meta=[];
    for(const r of recibos){
      const names=[];
      for(let i=0;i<r.photos.length;i++){
        const nm=`${r.year}/${r.year}-${pad(r.month)}_${r.type.toLowerCase()}_${r.id.slice(0,6)}_${i+1}.jpg`;
        names.push(nm);files.push({name:nm,data:new Uint8Array(await r.photos[i].arrayBuffer())});
      }
      meta.push({id:r.id,year:r.year,month:r.month,type:r.type,note:r.note||'',createdAt:r.createdAt,photos:names});
    }
    files.push({name:'datos.json',data:new TextEncoder().encode(JSON.stringify({version:1,exportedAt:Date.now(),recibos:meta},null,1))});
    const blob=buildZip(files);
    const d=new Date(),fname=`recibos-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.zip`;
    const f=new File([blob],fname,{type:'application/zip'});
    let done=false;
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      try{await navigator.share({files:[f],title:'Backup de recibos'});done=true;}
      catch(err){if(err.name==='AbortError'){$('expBtn').disabled=false;return;}}
    }
    if(!done){
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;
      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000);
    }
    lsSet('lastExport',String(Date.now()));
    toast('Backup listo');$('menuOv').classList.remove('on');render();
  }catch(err){toast('No se pudo exportar: '+err.message);}
  $('expBtn').disabled=false;
};
$('impBtn').onclick=()=>$('impIn').click();
$('impIn').onchange=async e=>{
  const file=e.target.files[0];e.target.value='';if(!file)return;
  try{
    const z=await readZip(file);
    if(!z['datos.json'])throw new Error('falta datos.json, no es un backup de esta app');
    const meta=JSON.parse(new TextDecoder().decode(z['datos.json']));
    const have=new Set(recibos.map(r=>r.id));let added=0;
    for(const m of meta.recibos){
      if(have.has(m.id))continue;
      const photos=m.photos.map(n=>{if(!z[n])throw new Error('falta la foto '+n);return new Blob([z[n]],{type:'image/jpeg'});});
      const thumb=await toJpeg(photos[0],260,0.8);
      await dbPut({id:m.id,year:m.year,month:m.month,type:m.type,note:m.note||'',photos,thumb,createdAt:m.createdAt||Date.now()});
      added++;
    }
    $('menuOv').classList.remove('on');await load();
    toast(added?`Se importaron ${added} recibo${added>1?'s':''}`:'No había recibos nuevos para importar');
  }catch(err){toast('No se pudo importar: '+err.message);}
};

/* ---------- Inicio ---------- */

  try{db=await openDB();await load();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}
  catch(err){$('list').innerHTML='<div class="empty"><b>No se pudo abrir el almacenamiento</b>Este navegador bloquea el guardado local. Probá en una ventana normal, no privada.</div>';}
})();
